# Phase 48 Plan 03 — native address-taken / func-value RTA fixture (D-15, criterion 4).
#
# repo/main.go takes the address of `handler` (a func()) and invokes it indirectly
# through a func-typed variable. RTA resolves the func-value dispatch via the
# address-taken set + signature match: main -> handler. `noise` (a func(int)) is
# also address-taken but has a mismatching signature, so it is excluded.
#
# The `eval::go_rta` gate asserts the indirect call's RTA edge to `handler` is
# derived (the func_value_resolved invariant); this manifest documents the
# acceptance contract. No `[[expected]]` row is captured because the solver-derived
# edges are crate-private and not observable manifest facts.

[repo]
path = "repo"

[budget]
max_runtime_ms = 120000
