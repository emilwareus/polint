# Framework entrypoint fixture with mixed Go and TS/JS sources.
#
# Go sources exercise: net/http HandleFunc, chi router (Get/Post), chi middleware (Use),
# cobra CLI command, Go test and benchmark naming conventions.
#
# TS/JS sources exercise: Express (app.get/post/use), MCP SDK (server.tool/resource/prompt).
#
# Expected observations assert that the full MIR -> call sites -> recognizer
# pipeline produces framework entrypoints, derived trust boundaries, and
# synthetic dispatch edges for the mixed Go and TS/JS source patterns.

