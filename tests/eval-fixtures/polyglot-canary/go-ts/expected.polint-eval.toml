# Phase 49 Plan 03 — polyglot Go+TS canary.
#
# The mixed repo proves the shared solver core can run Go RTA and TS token dispatch
# together without cross-language interference:
#
#   (a) Go edges resolve — `s.Speak()` resolves to the instantiated (Dog).Speak via
#       the Go RTA driver.
#   (b) TS token edges resolve — `const aliasMake = makeToken; aliasMake()` produces
#       an intra-TS token-policy call edge.
#   (c) No solver-derived edge crosses the Go<->TS language boundary.
#
# The executable proof lives in `eval::go_rta::polyglot_go_ts_canary_*` and
# `eval::ts_tokens::polyglot_canary_*`. No `[[expected]]` row is captured here
# because solver-derived edges are crate-private until Phase 52 projects them into
# observable refined-call rows.

[repo]
path = "repo"

[budget]
max_runtime_ms = 120000
