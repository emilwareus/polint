# Phase 48 Plan 03 — the polyglot Go+TS canary (D-16, GO-05 success criterion 3).
#
# This fixture is CREATED here for the first time; Phase 54 (BENCH-01) later promotes
# it to a HARD gate. It exercises cross-language non-regression through the shared
# solver core: with the Go RTA driver ACTIVE and the TS token policy still a STUB, a
# mixed Go+TS repo must show
#   (a) Go edges resolved — the `s.Speak()` interface invoke resolves to the
#       instantiated (Dog).Speak via the Go RTA driver, AND
#   (b) TS behavior UNCHANGED — the TS sources are analyzed (TS functions exist) but
#       the unified solver derives NO TS-endpoint edge (TsTokensPolicy is empty), so
#       there is no cross-language interference through the shared solver core.
#
# The executable proof lives in `eval::go_rta::polyglot_go_ts_canary_*` (it reads the
# kernel-built db's solver-derived edges + the Go/TS function-node identities,
# asserting the go_resolved_ts_unchanged invariant); this manifest documents the
# acceptance contract. No `[[expected]]` row is captured because the solver-derived
# edges are crate-private and not observable manifest facts (Phase 54 promotes this
# canary to a hard gate over the observable projection).

[repo]
path = "repo"

