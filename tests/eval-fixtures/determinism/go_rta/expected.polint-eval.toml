schema_version = "polint-eval-fixture-1"
case_id = "determinism-go-rta"
area = "facts"

# determinism-gate Go RTA fixture (D-17; REACH-03 D-20/D-21/D-24).
#
# `main` is the Go root (RootKind::Main). It instantiates Dog, converts it to the
# Greeter interface, and dispatches `g.Greet()` — the Go RTA driver derives the
# main -> (Dog).Greet edge into the polint.solver output. The unexported orphan ->
# orphanHelper call is never reached from any root, so its call site is outside the
# reachable graph (in_reachable_graph = false), satisfying the gate's reachable-graph
# marking invariant (>= 1 root, >= 1 call site, >= 1 unreachable mark).
#
# This manifest is intentionally free of order-dependent assertions: the
# `eval::determinism_gate` harness asserts the full normalized observed JSON is
# byte-identical across 10 seeded provider-order / row-order permutations — including
# the new RTA-derived solver edges — so no brittle per-row expectation is captured.

[repo]
path = "repo"

[budget]
max_runtime_ms = 120000
