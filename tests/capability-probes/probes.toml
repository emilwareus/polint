schema = "polint-capability-probes-1"

[[probe]]
id = "l1-go-banned-call"
level = "l1"
language = "go"
detector = "event:dangerousExec"
positive = "l1/go/banned-call/positive"
twins = ["l1/go/banned-call/twin-string"]

[[probe]]
id = "l1-typescript-banned-call"
level = "l1"
language = "typescript"
detector = "event:dangerousExec"
positive = "l1/typescript/banned-call/positive"
twins = ["l1/typescript/banned-call/twin-string"]

[[probe]]
id = "l1-go-dangerous-first-argument"
level = "l1"
language = "go"
detector = "call_literal:runCommand:0:unsafe"
positive = "l1/go/dangerous-argument/positive"
twins = ["l1/go/dangerous-argument/twin-safe-position"]

[[probe]]
id = "l1-typescript-dangerous-first-argument"
