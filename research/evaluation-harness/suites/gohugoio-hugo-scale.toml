# Locked scale-benchmark manifest (BENCH-01). Large Go repo.
# Pinned to gohugoio/hugo tag v0.140.0. CI-eligible (fast/nightly/release tiers).
# Clone target is git-ignored and resolved repo-relative only (no absolute paths).
schema_version = "polint-eval-suite-1"
id = "gohugoio-hugo-scale"
name = "Hugo scale (Go)"
kind = "performance"
languages = ["go"]
adapter_id = "polint_scale_performance"
scoring_mode = "whole-repo"
source_url = "https://github.com/gohugoio/hugo"
source_commit = "3f35721fb2c75a1f7cc5a7a14400b66e73d4b06e"
license = "Apache-2.0"
language_support = "supported"

[checkout]
strategy = "local_clone"
path = "research/evaluation-harness/repos/gohugoio-hugo"
ignored_by_git = true
local_clone_policy = "repo_relative_only"

[expected]
format = "suite_native"
path = "suite-native-gohugoio-hugo-scale"

[scoring]
unified = [
  "peak_rss_bytes",
  "cold_wall_clock_ms",
  "warm_wall_clock_ms",
]

[tiers.fast]
enabled = true
selector = "sample:balanced:6"
max_cases = 6
deterministic_seed = "gohugoio-hugo-scale-fast"

[tiers.nightly]
enabled = true
selector = "all"
deterministic_seed = "gohugoio-hugo-scale-nightly"

[tiers.release]
enabled = true
selector = "all"
deterministic_seed = "gohugoio-hugo-scale-release"
