schema_version = "polint-eval-suite-1"
id = "owasp-benchmark-java-1.2"
name = "OWASP Benchmark Java"
kind = "scanner_vulnerability"
languages = ["java"]
adapter_id = "owasp_expected_results_csv"
source_url = "https://github.com/OWASP-Benchmark/BenchmarkJava"
source_commit = "61b831658171"
license = "license-review-needed"
language_support = "adapter_only"

[checkout]
strategy = "local_clone"
path = "research/evaluation-harness/repos/BenchmarkJava"
ignored_by_git = true

[expected]
format = "owasp_expected_results_csv"
path = "expectedresults-1.2.csv"

[scoring]
native = ["owasp_confusion_matrix", "owasp_score"]
unified = ["precision", "recall", "f1", "f2", "f3", "false_positive_rate"]

[tiers.fast]
enabled = true
selector = "sample:balanced:50"
max_cases = 50
deterministic_seed = "owasp-java-fast"

[tiers.nightly]
enabled = true
selector = "all"

[tiers.release]
enabled = true
selector = "all"

