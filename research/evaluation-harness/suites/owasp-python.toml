schema_version = "polint-eval-suite-1"
id = "owasp-benchmark-python-preliminary"
name = "OWASP BenchmarkPython"
kind = "scanner_vulnerability"
languages = ["python"]
adapter_id = "owasp_expected_results_csv"
source_url = "https://github.com/OWASP-Benchmark/BenchmarkPython"
source_commit = "9f0d34945a88"
license = "license-review-needed"
language_support = "adapter_only"

[checkout]
strategy = "local_clone"
path = "research/evaluation-harness/repos/BenchmarkPython"
ignored_by_git = true

[expected]
format = "owasp_expected_results_csv"
path = "expectedresults.csv"

[scoring]
native = ["owasp_confusion_matrix", "owasp_score"]
unified = ["precision", "recall", "f1", "f2", "f3", "false_positive_rate"]

[tiers.fast]
enabled = true
selector = "sample:balanced:50"
max_cases = 50
deterministic_seed = "owasp-python-fast"

[tiers.nightly]
enabled = true
selector = "all"

[tiers.release]
enabled = true
selector = "all"
