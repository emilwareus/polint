name: polint
description: Run polint with GitHub Actions annotations and built-in cache restore/save.
author: emilwareus

branding:
  icon: check-circle
  color: purple

inputs:
  version:
    description: polint release version to install. Use latest, vX.Y.Z, or X.Y.Z.
    required: false
    default: latest
  args:
    description: Arguments passed to polint.
    required: false
    default: check --format github
  cache:
    description: Restore and save the polint caches. Master switch for the analysis cache and the rule-host build cache.
    required: false
    default: "true"
  cache-rule-builds:
    description: Restore and save Cargo build intermediates for repo-local rule hosts under a separate build-input key. Ignored when cache is false.
    required: false
    default: "true"
  rule-paths:
    description: Override the repo-local rule package directories the build cache covers, newline- or comma-separated. Empty reads [rules] paths from .polint.toml.
    required: false
    default: ""
  build-cache-max-size-mb:
    description: Refuse to save the rule-host build cache when the pruned directories exceed this many MB. Empty means report the size without a ceiling.
    required: false
    default: ""
  cache-key-prefix:
    description: Prefix for GitHub Actions cache keys.
    required: false
    default: polint
  working-directory:
    description: Repository directory where polint should run.
    required: false
    default: .
  fail-on:
    description: Optional value for polint --fail-on. Leave empty when args already set it.
    required: false
    default: ""

outputs:
  version:
    description: Installed polint version.
    value: ${{ steps.install.outputs.version }}
  cache-hit:
    description: Whether the primary polint analysis cache key was restored.
    value: ${{ steps.cache-restore.outputs.cache-hit }}
  rule-build-cache-hit:
    description: Whether the exact repo-local rule-host build cache key was restored. Empty when rule-host build caching did not run.
    value: ${{ steps.rule-build-restore.outputs.cache-hit }}
  rule-build-cache-skipped:
    description: Why rule-host build caching did not run, or empty when it ran.
    value: ${{ steps.cache-inputs.outputs.build-cache-skipped }}
  rule-build-cache-save-skipped:
    description: Why the rule-host build cache was not saved after this run, or empty when it was saved or never ran.
    value: ${{ steps.rule-build-save.outputs.save-skipped }}
  rule-build-cache-size-mb:
    description: Size in MB of the rule-host build cache directories after pruning, or empty when they were not measured.
    value: ${{ steps.rule-build-save.outputs.size-mb }}
  exit-code:
    description: polint process exit code.
    value: ${{ steps.run-polint.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install polint
      id: install
      shell: bash
      run: |
        set -euo pipefail

        requested="${{ inputs.version }}"
        if [[ -z "${requested}" || "${requested}" == "latest" ]]; then
          release_path="latest/download"
          display_version="latest"
          cargo_version_args=()
        else
          case "${requested}" in
            v*) tag="${requested}" ;;
            *) tag="v${requested}" ;;
          esac
          release_path="download/${tag}"
          display_version="${tag}"
          cargo_version_args=(--version "${tag#v}")
        fi

        case "${RUNNER_OS}" in
          Linux)
            asset_os="linux"
            binary="polint"
            ;;
          macOS)
            asset_os="macos"
            binary="polint"
            ;;
          Windows)
            asset_os="windows"
            binary="polint.exe"
            ;;
          *)
            echo "::error::unsupported runner OS: ${RUNNER_OS}"
            exit 1
            ;;
        esac

        case "${RUNNER_ARCH}" in
          X64) asset_arch="x86_64" ;;
          ARM64) asset_arch="aarch64" ;;
          *)
            echo "::error::unsupported runner architecture: ${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        asset="polint-${asset_os}-${asset_arch}.tar.gz"
        base_url="https://github.com/oaiz-io/polint/releases/${release_path}"
        tmp_dir="$(mktemp -d)"
        install_dir="${RUNNER_TEMP}/polint/bin"
        mkdir -p "${install_dir}"
        trap 'rm -rf "${tmp_dir}"' EXIT

        if command -v curl >/dev/null 2>&1; then
          fetch() { curl -fsSL "$1" -o "$2"; }
        elif command -v wget >/dev/null 2>&1; then
          fetch() { wget -q "$1" -O "$2"; }
        else
          echo "::error::curl or wget is required to download polint release assets"
          exit 1
        fi

        echo "Installing polint ${display_version} from ${asset}..."
        if fetch "${base_url}/${asset}" "${tmp_dir}/${asset}" && fetch "${base_url}/${asset}.sha256" "${tmp_dir}/${asset}.sha256"; then
          (
            cd "${tmp_dir}"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 -c "${asset}.sha256"
            elif command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "${asset}.sha256"
            else
              echo "::error::shasum or sha256sum is required to verify ${asset}"
              exit 1
            fi
            tar -xzf "${asset}"
          )
          cp "${tmp_dir}/${binary}" "${install_dir}/${binary}"
          chmod +x "${install_dir}/${binary}"
        else
          echo "::warning::release asset ${asset} was not available; falling back to cargo install polint ${requested}"
          cargo install polint --locked "${cargo_version_args[@]}"
          install_dir="${HOME}/.cargo/bin"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="polint.exe"
          else
            binary="polint"
          fi
        fi

        echo "${install_dir}" >> "${GITHUB_PATH}"
        installed="$("${install_dir}/${binary}" --version)"
        echo "${installed}"
        echo "version=${installed#polint }" >> "${GITHUB_OUTPUT}"

    - name: Resolve polint cache inputs
      id: cache-inputs
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        POLINT_ACTION_CACHE_RULE_BUILDS: ${{ inputs.cache-rule-builds }}
        POLINT_ACTION_RULE_PATHS: ${{ inputs.rule-paths }}
        POLINT_ACTION_SCRIPT_DIR: ${{ github.action_path }}/scripts/action
        POLINT_ACTION_STATE_DIR: ${{ runner.temp }}
      run: |
        set -uo pipefail

        # Cache resolution is an optimization. If it cannot run at all, say so
        # and continue with no cache rather than failing the job before polint
        # has had a chance to run.
        script="${POLINT_ACTION_SCRIPT_DIR}/resolve-cache-inputs.sh"
        if [[ ! -f "${script}" ]] || ! bash "${script}"; then
          echo "::warning::polint cache input resolution failed; this run uses no polint cache."
          {
            printf 'analysis-cache=false\n'
            printf 'build-cache=false\n'
            printf 'build-cache-skipped=%s\n' "cache input resolution failed"
          } >> "${GITHUB_OUTPUT}"
        fi

    - name: Restore polint analysis cache
      id: cache-restore
      if: ${{ inputs.cache == 'true' && steps.cache-inputs.outputs.analysis-cache == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.polint/cache/analysis
          ${{ inputs.working-directory }}/.polint/cache/layers
          ${{ inputs.working-directory }}/.polint/cache/derived
          ${{ inputs.working-directory }}/.polint/cache/semantic-store
        key: ${{ inputs.cache-key-prefix }}-analysis-${{ runner.os }}-${{ steps.install.outputs.version }}-${{ steps.cache-inputs.outputs.analysis-digest }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-analysis-${{ runner.os }}-${{ steps.install.outputs.version }}-

    - name: Restore polint rule-host build cache
      id: rule-build-restore
      if: ${{ inputs.cache == 'true' && steps.cache-inputs.outputs.build-cache == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.polint/cache/rules-target
          ${{ inputs.working-directory }}/.polint/cache/extensions-target
        key: ${{ inputs.cache-key-prefix }}-rules-build-v2-${{ runner.os }}-${{ runner.arch }}-env-${{ steps.cache-inputs.outputs.env-digest }}-deps-${{ steps.cache-inputs.outputs.deps-digest }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-rules-build-v2-${{ runner.os }}-${{ runner.arch }}-env-${{ steps.cache-inputs.outputs.env-digest }}-deps-

    - name: Run polint
      id: run-polint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        POLINT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        extra_args=()
        if [[ -n "${POLINT_FAIL_ON}" ]]; then
          extra_args+=(--fail-on "${POLINT_FAIL_ON}")
        fi
        polint ${{ inputs.args }} "${extra_args[@]}"
        status=$?
        set -e
        echo "exit-code=${status}" >> "${GITHUB_OUTPUT}"
        exit 0

    - name: Prepare the polint rule-host build cache for saving
      id: rule-build-save
      if: ${{ always() && inputs.cache == 'true' && steps.cache-inputs.outputs.build-cache == 'true' && steps.rule-build-restore.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        POLINT_ACTION_EXIT_CODE: ${{ steps.run-polint.outputs.exit-code }}
        POLINT_ACTION_RULE_PACKAGES_FILE: ${{ steps.cache-inputs.outputs.rule-packages-file }}
        POLINT_ACTION_EXTENSION_PACKAGES_FILE: ${{ steps.cache-inputs.outputs.extension-packages-file }}
        POLINT_ACTION_RULES_PROFILE: ${{ steps.cache-inputs.outputs.rules-profile }}
        POLINT_ACTION_MAX_SIZE_MB: ${{ inputs.build-cache-max-size-mb }}
        POLINT_ACTION_SCRIPT_DIR: ${{ github.action_path }}/scripts/action
      run: |
        set -uo pipefail

        # A save this step cannot vouch for is a save that must not happen:
        # `actions/cache` never overwrites an existing key, so one bad entry is
        # permanent for that key.
        script="${POLINT_ACTION_SCRIPT_DIR}/prepare-build-cache-save.sh"
        if [[ ! -f "${script}" ]] || ! bash "${script}"; then
          echo "::warning::polint build-cache preparation failed; the rule-host build cache is not saved this run."
          {
            printf 'save=false\n'
            printf 'save-skipped=%s\n' "build cache preparation failed"
          } >> "${GITHUB_OUTPUT}"
        fi

    - name: Save polint rule-host build cache
      if: ${{ always() && inputs.cache == 'true' && steps.cache-inputs.outputs.build-cache == 'true' && steps.rule-build-restore.outputs.cache-hit != 'true' && steps.rule-build-save.outputs.save == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.polint/cache/rules-target
          ${{ inputs.working-directory }}/.polint/cache/extensions-target
        key: ${{ steps.rule-build-restore.outputs.cache-primary-key }}

    - name: Save polint analysis cache
      if: ${{ always() && inputs.cache == 'true' && steps.cache-inputs.outputs.analysis-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.polint/cache/analysis
          ${{ inputs.working-directory }}/.polint/cache/layers
          ${{ inputs.working-directory }}/.polint/cache/derived
          ${{ inputs.working-directory }}/.polint/cache/semantic-store
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}

    - name: Fail on polint findings
      if: ${{ always() && steps.run-polint.outputs.exit-code != '0' }}
      shell: bash
      run: exit "${{ steps.run-polint.outputs.exit-code }}"
