name: Feature request
description: Propose a capability the project does not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does the project stop you? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: The current workaround, and why it is not enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Optional. Command, API, or config as you would want to use it.
      render: shell
