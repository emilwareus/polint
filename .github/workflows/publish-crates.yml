name: Publish crates.io

# Automatic: on pushes to main whose latest commit is the post-merge version bump
# (`chore(release): bump crate version`), publishes all workspace crates in order.
#
# Manual: workflow_dispatch — dry-run (default) or full publish without waiting for a bump.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: If true, only smoke dry-run (polint-diagnostics) + print order
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Dry run (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: DRY_RUN=1 ./scripts/publish-crates.sh

      - name: Publish all crates (manual, not dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CRATES_IO_TOKEN:-}" ]]; then
            echo "::error::CRATES_IO_TOKEN is not set."
            exit 1
          fi
          ./scripts/publish-crates.sh

      - name: Publish all crates (automatic after bump commit)
        if: >-
          github.event_name == 'push'
          && github.event.head_commit != null
          && contains(github.event.head_commit.message, 'chore(release): bump crate version')
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CRATES_IO_TOKEN:-}" ]]; then
            echo "::error::Automated publishing requires CRATES_IO_TOKEN (repo Settings → Secrets and variables → Actions)."
            exit 1
          fi
          ./scripts/publish-crates.sh
