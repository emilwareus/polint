# One-shot release: bump workspace patch version, push to main, create GitHub tag vX.Y.Z,
# optionally publish to crates.io, attach CLI binaries to that tag's release,
# and move the stable action major tag.

name: Release

on:
  workflow_dispatch:
    inputs:
      publish_crates:
        description: Publish all workspace crates to crates.io (after tag)
        type: boolean
        default: true
      publish_cli:
        description: Build CLI and upload archives to the GitHub Release for this tag
        type: boolean
        default: true
      publish_action:
        description: Move the stable v1 GitHub Action tag to this release commit
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-and-tag:
    name: Bump version, push main, create tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' && secrets.WORKFLOW_PUSH_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync main
        run: git pull --rebase origin main

      - name: Bump patch version
        id: bump
        run: |
          new="$(python3 scripts/bump-workspace-version.py)"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Refresh Cargo.lock
        run: cargo build --workspace

      - name: Commit and push to main
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --staged --quiet; then
            echo "::error::No version changes to commit."
            exit 1
          fi
          git commit -m "chore(release): bump crate version to ${NEW_VERSION}"
          git push origin main

      - name: Create and push tag
        id: metadata
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${NEW_VERSION}"
          git tag -a "${TAG}" -m "polint ${NEW_VERSION}"
          git push origin "${TAG}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  crates-io:
    name: Publish crates.io
    needs: bump-and-tag
    if: github.ref == 'refs/heads/main' && inputs.publish_crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CRATES_IO_TOKEN:-}" ]]; then
            echo "::error::CRATES_IO_TOKEN is not set."
            exit 1
          fi
          ./scripts/publish-crates.sh

  build-cli:
    name: CLI ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    needs: bump-and-tag
    if: github.ref == 'refs/heads/main' && inputs.publish_cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: polint
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: aarch64
            target: aarch64-unknown-linux-gnu
            binary_name: polint
          - runner: macos-14
            asset_os: macos
            asset_arch: x86_64
            target: x86_64-apple-darwin
            binary_name: polint
          - runner: macos-14
            asset_os: macos
            asset_arch: aarch64
            target: aarch64-apple-darwin
            binary_name: polint
          - runner: windows-latest
            asset_os: windows
            asset_arch: x86_64
            target: x86_64-pc-windows-msvc
            binary_name: polint.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}

      - name: Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure cross target std is installed
        run: rustup target add ${{ matrix.target }}

      - name: Build polint
        run: cargo build --locked --release -p polint --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="polint-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          mkdir -p dist package
          bin="${{ matrix.binary_name }}"
          cp "target/${{ matrix.target }}/release/${bin}" "package/${bin}"
          if [[ "${bin}" == polint ]]; then
            chmod 0755 "package/${bin}"
          fi
          tar -C package -czf "dist/${archive}" "${bin}"
          python3 scripts/sha256_file.py "dist/${archive}" > "dist/${archive}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: polint-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error

  github-release-cli:
    name: GitHub Release assets
    needs: [bump-and-tag, build-cli]
    if: github.ref == 'refs/heads/main' && inputs.publish_cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump-and-tag.outputs.tag }}
          VERSION: ${{ needs.bump-and-tag.outputs.version }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No artifacts in dist/"
            exit 1
          fi
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --repo "${REPO}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" \
              --repo "${REPO}" \
              --title "polint ${VERSION}" \
              --notes "Install: \`cargo install polint --locked\` at **${VERSION}**, or use a \`polint-*\` archive below. See [README](https://github.com/${REPO}#installation)."
          fi

  publish-action:
    name: Publish GitHub Action tag
    needs: [bump-and-tag, github-release-cli]
    if: >-
      ${{
        always()
        && github.ref == 'refs/heads/main'
        && inputs.publish_action
        && needs.bump-and-tag.result == 'success'
        && (needs.github-release-cli.result == 'success' || needs.github-release-cli.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN != '' && secrets.WORKFLOW_PUSH_TOKEN || github.token }}

      - name: Move v1 action tag
        env:
          RELEASE_TAG: ${{ needs.bump-and-tag.outputs.tag }}
          ACTION_TAG: v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${ACTION_TAG}" "${RELEASE_TAG}"
          git push --force origin "refs/tags/${ACTION_TAG}"
          echo "Published GitHub Action ${ACTION_TAG} at ${RELEASE_TAG}."
