# Exercise release builds and packaging on every branch/PR without publishing:
# no version bump, no tag, no crates.io upload, no GitHub Release.

name: Release dry-run

on:
  pull_request:
  push:

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  crates-publish-dry-run:
    name: crates.io publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish --dry-run
        run: DRY_RUN=1 ./scripts/publish-crates.sh

  build-cli:
    name: CLI ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: polint
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: aarch64
            target: aarch64-unknown-linux-gnu
            binary_name: polint
          - runner: macos-14
            asset_os: macos
            asset_arch: x86_64
            target: x86_64-apple-darwin
            binary_name: polint
          - runner: macos-14
            asset_os: macos
            asset_arch: aarch64
            target: aarch64-apple-darwin
            binary_name: polint
          - runner: windows-latest
            asset_os: windows
            asset_arch: x86_64
            target: x86_64-pc-windows-msvc
            binary_name: polint.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build polint
        run: cargo build --locked --release -p polint --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="polint-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          mkdir -p dist package
          bin="${{ matrix.binary_name }}"
          cp "target/${{ matrix.target }}/release/${bin}" "package/${bin}"
          if [[ "${bin}" == polint ]]; then
            chmod 0755 "package/${bin}"
          fi
          tar -C package -czf "dist/${archive}" "${bin}"
          python3 scripts/sha256_file.py "dist/${archive}" > "dist/${archive}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: polint-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error
