name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV (1.95) — cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  clippy:
    name: clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-linux:
    name: ubuntu-latest — full workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Free hosted runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost /opt/ghc
          df -h

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: ./.github/actions/prefetch-embedded-go-analyzers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-features --locked

      - name: input-snapshot runtime gate (serialized)
        run: >-
          cargo test -p polint --lib --all-features --locked
          --profile performance-gate
          eval::fixtures::eval_native_fixture_runner_tests::eval_input_snapshot_fixture_meets_runtime_budget
          -- --exact --ignored --test-threads=1 --nocapture

      - name: semantic-store supported-boundary authenticity smoke (serialized)
        run: >-
          cargo test -p polint --lib --all-features --locked
          --profile performance-gate
          eval::bench::gate::tests::semantic_store_boundary::supported_boundary_authenticity_smoke_passes_paired_budget
          -- --exact --ignored --test-threads=1 --nocapture

      - name: semantic-store generated scale gate (serialized, Linux only)
        run: >-
          cargo test -p polint --lib --all-features --locked
          --profile performance-gate
          eval::bench::gate::tests::semantic_store_boundary::generated_scale_store_enabled_measurement_passes_paired_budget
          -- --exact --ignored --test-threads=1 --nocapture

  test-platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-latest — platform library tests
            shard: all
            timeout: 60
          - os: windows-latest
            name: windows-latest — platform library tests
            shard: non-fixtures
            timeout: 60
          - os: windows-latest
            name: windows-latest — platform fixture tests (1/4)
            shard: fixtures
            fixture_index: 0
            fixture_count: 4
            timeout: 90
          - os: windows-latest
            name: windows-latest — platform fixture tests (2/4)
            shard: fixtures
            fixture_index: 1
            fixture_count: 4
            timeout: 90
          - os: windows-latest
            name: windows-latest — platform fixture tests (3/4)
            shard: fixtures
            fixture_index: 2
            fixture_count: 4
            timeout: 90
          - os: windows-latest
            name: windows-latest — platform fixture tests (4/4)
            shard: fixtures
            fixture_index: 3
            fixture_count: 4
            timeout: 90
          - os: windows-latest
            name: windows-latest — composite fixture test
            shard: composite-fixture
            timeout: 120

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: ./.github/actions/prefetch-embedded-go-analyzers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: published-cache concurrency smoke (Windows)
        if: matrix.shard == 'non-fixtures'
        run: >-
          cargo test -p polint --lib --all-features --locked
          go::semantic::process::tests::published_cache_capacity_serializes_concurrent_publishers
          -- --exact --test-threads=1 --nocapture

      - name: embedded Go frontend local-proxy smoke (Windows)
        if: matrix.shard == 'non-fixtures'
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: >-
          cargo test -p polint --lib --all-features --locked
          go::semantic::process::tests::embedded_frontend_runs_semantic_analysis_without_repository_writes
          -- --exact --test-threads=1 --nocapture

      - name: cargo test
        if: matrix.shard == 'all'
        env:
          POLINT_REQUIRE_WINDOWS_CASE_SENSITIVE_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cargo test -p polint --lib --all-features --locked

      - name: cargo test (non-fixture shard)
        if: matrix.shard == 'non-fixtures'
        env:
          POLINT_REQUIRE_WINDOWS_CASE_SENSITIVE_TEST: "1"
        run: >-
          cargo test -p polint --lib --all-features --locked
          -- --skip eval::fixtures::
          --skip go::semantic::process::tests::embedded_frontend_runs_semantic_analysis_without_repository_writes

      - name: cargo test (fixture shard)
        if: matrix.shard == 'fixtures'
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          POLINT_REQUIRE_WINDOWS_CASE_SENSITIVE_TEST: "1"
          POLINT_WINDOWS_FIXTURE_SHARD_INDEX: ${{ matrix.fixture_index }}
          POLINT_WINDOWS_FIXTURE_SHARD_COUNT: ${{ matrix.fixture_count }}
        run: |
          $ErrorActionPreference = "Stop"
          $composite = "eval::fixtures::eval_native_fixture_runner_tests::eval_native_fixture_suite_covers_required_categories"
          $listed = & cargo test -p polint --lib --all-features --locked "eval::fixtures::" -- --list --format terse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tests = @(
            $listed | ForEach-Object {
              if ($_ -match '^(eval::fixtures::.+): test$') {
                $name = $Matches[1]
                if ($name -ne $composite) { $name }
              }
            } | Sort-Object
          )
          $shardIndex = [int]$env:POLINT_WINDOWS_FIXTURE_SHARD_INDEX
          $shardCount = [int]$env:POLINT_WINDOWS_FIXTURE_SHARD_COUNT
          if ($shardCount -lt 1 -or $shardIndex -lt 0 -or $shardIndex -ge $shardCount) {
            throw "invalid Windows fixture shard $shardIndex/$shardCount"
          }

          $selected = @()
          for ($index = 0; $index -lt $tests.Count; $index++) {
            if (($index % $shardCount) -eq $shardIndex) {
              $selected += $tests[$index]
            }
          }
          if ($selected.Count -eq 0) {
            throw "Windows fixture shard $shardIndex/$shardCount selected no tests"
          }

          Write-Host "Running $($selected.Count) of $($tests.Count) Windows fixture tests"
          foreach ($test in $selected) {
            & cargo test -p polint --lib --all-features --locked $test -- --exact --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: cargo test (composite fixture shard)
        if: matrix.shard == 'composite-fixture'
        env:
          POLINT_REQUIRE_WINDOWS_CASE_SENSITIVE_TEST: "1"
        run: >-
          cargo test -p polint --lib --all-features --locked
          eval::fixtures::eval_native_fixture_runner_tests::eval_native_fixture_suite_covers_required_categories
          -- --exact

      - name: input-snapshot runtime gate (serialized)
        if: matrix.shard == 'all' || matrix.shard == 'non-fixtures'
        run: >-
          cargo test -p polint --lib --all-features --locked
          --profile performance-gate
          eval::fixtures::eval_native_fixture_runner_tests::eval_input_snapshot_fixture_meets_runtime_budget
          -- --exact --ignored --test-threads=1 --nocapture

      - name: semantic-store supported-boundary authenticity smoke (serialized)
        if: matrix.shard == 'all' || matrix.shard == 'non-fixtures'
        run: >-
          cargo test -p polint --lib --all-features --locked
          --profile performance-gate
          eval::bench::gate::tests::semantic_store_boundary::supported_boundary_authenticity_smoke_passes_paired_budget
          -- --exact --ignored --test-threads=1 --nocapture

  leak-gate:
    # Blocks accidental expansion of the supported public API on Linux and macOS.
    # Runs on every PR on Linux AND macOS. fail-fast: false means each platform
    # reports independently — a Linux pass + macOS fail still blocks the PR (no
    # averaging or skipping either platform). New public types must pass this gate.
    name: public surface leak gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: run public-surface-leak gate
        run: cargo test --package polint --test public_surface_leak --locked

  determinism-gate:
    # Blocks provider-order nondeterminism on Linux and macOS.
    # Runs the N=10 seeded-permutation byte-identity gate on every PR on Linux AND
    # macOS. fail-fast: false means each platform reports INDEPENDENTLY — a Linux
    # pass + macOS fail still blocks the PR (no averaging, no skipping either
    # platform, mirroring the leak-gate contract). New providers auto-enroll via
    # provider_manifests(), and the determinism fixtures must stay green.
    # This is a fast-CI (PR-blocking) job, not nightly.
    name: determinism gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: ./.github/actions/prefetch-embedded-go-analyzers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: run determinism gate (N=10 seeded permutations)
        run: cargo test -p polint --lib eval::determinism_gate --locked

  promotion-gate:
    # Combines the polyglot canary with public-surface and determinism checks.
    # Runs the polyglot Go+TS canary, public-surface leak gate, and determinism
    # gate together on Linux AND macOS. fail-fast: false keeps platform verdicts
    # independent: a pass on one platform never hides a failure on the other.
    name: promotion gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: ./.github/actions/prefetch-embedded-go-analyzers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: run polyglot Go+TS canary
        run: cargo test -p polint polyglot --lib --locked

      - name: run public-surface-leak gate
        run: cargo test --package polint --test public_surface_leak --locked

      - name: run determinism gate
        run: cargo test -p polint --lib eval::determinism_gate --locked

  install-smoke:
    name: cargo install smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo install smoke (release install + --version)
        run: cargo test -p polint --test cargo_install_smoke --locked -- --ignored

  sarif:
    name: SARIF fixture + Code Scanning upload
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build polint (debug)
        run: cargo build -p polint --locked
      - name: Emit SARIF from example workspace
        run: |
          ../../target/debug/polint check --format sarif --fail-on none > polint-results.sarif
        working-directory: examples/ts-design-tokens
      - name: Validate SARIF shape
        run: |
          python3 - <<'PY'
          import json

          with open('examples/ts-design-tokens/polint-results.sarif') as f:
              sarif = json.load(f)
          assert sarif["version"] == "2.1.0"
          for rule in sarif["runs"][0]["tool"]["driver"].get("rules", []):
              assert "tags" not in rule
              assert "polint" in rule.get("properties", {}).get("tags", [])
          PY
      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: examples/ts-design-tokens/polint-results.sarif

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  supply-chain:
    name: cargo deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked
