name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV (1.95) — cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95

      - name: cargo check (workspace MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  clippy-test-install:
    name: ${{ matrix.os }} — clippy, test, cargo install smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features --locked

      - name: cargo install smoke (release install + --version)
        run: cargo test -p polint --test cargo_install_smoke --locked -- --ignored

  sarif:
    name: SARIF fixture + Code Scanning upload
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build polint (debug)
        run: cargo build -p polint --locked
      - name: Emit SARIF from example workspace
        run: |
          ../../target/debug/polint check --format sarif --fail-on none > polint-results.sarif
        working-directory: examples/ts-design-tokens
      - name: Validate SARIF shape
        run: |
          python3 - <<'PY'
          import json

          with open('examples/ts-design-tokens/polint-results.sarif') as f:
              sarif = json.load(f)
          assert sarif["version"] == "2.1.0"
          for rule in sarif["runs"][0]["tool"]["driver"].get("rules", []):
              assert "tags" not in rule
              assert "polint" in rule.get("properties", {}).get("tags", [])
          PY
      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: examples/ts-design-tokens/polint-results.sarif

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  supply-chain:
    name: cargo deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked
