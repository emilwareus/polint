name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV (1.95) — cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  clippy:
    name: clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-linux:
    name: ubuntu-latest — full workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free hosted runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost /opt/ghc
          df -h

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-features --locked

  test-platform:
    name: ${{ matrix.os }} — platform library tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p polint --lib --all-features --locked

  leak-gate:
    # V1.3 PUBLIC-SURFACE-LEAK GATE — see Phase 42 D-17, D-18, D-19.
    # Runs on every PR on Linux AND macOS. fail-fast: false means each platform
    # reports independently — a Linux pass + macOS fail still blocks the PR (no
    # averaging, no skipping either platform, D-18). Every subsequent v1.3 phase
    # (43-54) inherits this gate as a precondition for landing public types.
    name: public surface leak gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: run public-surface-leak gate
        run: cargo test --package polint --test public_surface_leak --locked

  determinism-gate:
    # V1.3 DETERMINISM GATE — see Phase 43 Plan 03, D-20, D-21, D-22, D-24, D-25.
    # Runs the N=10 seeded-permutation byte-identity gate on every PR on Linux AND
    # macOS. fail-fast: false means each platform reports INDEPENDENTLY — a Linux
    # pass + macOS fail still blocks the PR (no averaging, no skipping either
    # platform, D-24, mirroring the leak-gate contract). Every subsequent
    # solver-introducing phase (44-54) INHERITS this gate as a precondition for
    # landing: a new provider auto-enrolls via provider_manifests() (D-22), and
    # the determinism fixtures must stay green as a named acceptance gate (D-25).
    # This is a fast-CI (PR-blocking) job, not nightly.
    name: determinism gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: run determinism gate (N=10 seeded permutations)
        run: cargo test -p polint --lib eval::determinism_gate --locked

  promotion-gate:
    # V1.3 PROMOTION GATE — see Phase 54 BENCH-01.
    # Runs the polyglot Go+TS canary, public-surface leak gate, and determinism
    # gate together on Linux AND macOS. fail-fast: false keeps platform verdicts
    # independent: a pass on one platform never hides a failure on the other.
    name: promotion gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/go-sidecar/polint-go-frontend/go.sum
            tools/polint-go-symbols/go.sum
            crates/polint/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: run polyglot Go+TS canary
        run: cargo test -p polint polyglot --lib --locked

      - name: run public-surface-leak gate
        run: cargo test --package polint --test public_surface_leak --locked

      - name: run determinism gate
        run: cargo test -p polint --lib eval::determinism_gate --locked

  install-smoke:
    name: cargo install smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo install smoke (release install + --version)
        run: cargo test -p polint --test cargo_install_smoke --locked -- --ignored

  sarif:
    name: SARIF fixture + Code Scanning upload
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build polint (debug)
        run: cargo build -p polint --locked
      - name: Emit SARIF from example workspace
        run: |
          ../../target/debug/polint check --format sarif --fail-on none > polint-results.sarif
        working-directory: examples/ts-design-tokens
      - name: Validate SARIF shape
        run: |
          python3 - <<'PY'
          import json

          with open('examples/ts-design-tokens/polint-results.sarif') as f:
              sarif = json.load(f)
          assert sarif["version"] == "2.1.0"
          for rule in sarif["runs"][0]["tool"]["driver"].get("rules", []):
              assert "tags" not in rule
              assert "polint" in rule.get("properties", {}).get("tags", [])
          PY
      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: examples/ts-design-tokens/polint-results.sarif

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  supply-chain:
    name: cargo deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked
