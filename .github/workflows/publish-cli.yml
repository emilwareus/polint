name: Publish CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cli-main
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            asset_os: macos
            asset_arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-14
            asset_os: macos
            asset_arch: aarch64
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build polint
        run: cargo build --locked --release -p polint-cli --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          archive="polint-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/polint" package/polint
          chmod 0755 package/polint
          tar -C package -czf "dist/${archive}" polint
          (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: polint-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish polint-main release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: polint-main
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "polint main build" \
              --notes "Rolling prebuilt CLI for \`main\` (Linux/macOS, x86_64 and aarch64). Updated by GitHub Actions on pushes to \`main\`. [Install from source or binary.](https://github.com/${GITHUB_REPOSITORY}#installation)" \
              --prerelease
          fi
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "polint main build" \
            --notes "Rolling prebuilt CLI from ${GITHUB_SHA} on \`main\`. See [README](https://github.com/${GITHUB_REPOSITORY}#installation) for \`cargo install\` and the install script." \
            --prerelease

          gh release upload "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
