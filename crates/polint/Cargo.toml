[package]
name = "polint"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Multi-language repo-local static-analysis rules (Go and TypeScript/JavaScript today)"

[features]
default = []
# Exposes `polint::_bench::*` for the internal `polint-bench` crate only.
bench = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
globset.workspace = true
ignore.workspace = true
json-strip-comments.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_resolver.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
petgraph.workspace = true
polint-core.workspace = true
polint-ir.workspace = true
polint-analysis-api.workspace = true
polint-macros = { path = "../polint-macros", version = "0.1.7" }
rayon.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter.workspace = true
tree-sitter-go.workspace = true

# Unix-only: src/measure.rs reads getrusage(RUSAGE_SELF).ru_maxrss for
# peak RSS. Windows uses K32GetProcessMemoryInfo (kernel32) with no crate dependency.
# Direct promotion of an already-vetted transitive dep (present in Cargo.lock).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "polint"
path = "src/main.rs"

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true
toml.workspace = true

# polint owns its lint table (instead of `[lints] workspace = true`) so that the
# single audited `getrusage` FFI in src/measure.rs can opt in via a
# per-item `#[allow(unsafe_code)]`. Every workspace lint is mirrored verbatim;
# ONLY `unsafe_code` is downgraded `forbid` -> `deny`, so unsafe stays denied
# crate-wide and any use must carry an explicit, greppable allow. See
# 63-01-SUMMARY.md "Deviations from Plan".
[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
