[package]
name = "polint"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Multi-language repo-local static-analysis rules (Go and TypeScript/JavaScript today)"

[features]
default = []
# Exposes `polint::_bench::*` for the internal `polint-bench` crate only.
bench = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
fnv.workspace = true
globset.workspace = true
ignore.workspace = true
json-strip-comments.workspace = true
lz4_flex.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_resolver.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
petgraph.workspace = true
polint-macros = { path = "../polint-macros", version = "0.1.7" }
rayon.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter.workspace = true
tree-sitter-go.workspace = true

# Unix-only: src/eval/bench/measure.rs reads getrusage(RUSAGE_SELF).ru_maxrss for
# peak RSS. Windows uses K32GetProcessMemoryInfo (kernel32) with no crate dependency.
# Direct promotion of an already-vetted transitive dep (present in Cargo.lock).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows-only filesystem certification, DACL sealing, and process containment.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "polint"
path = "src/main.rs"

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true

# polint owns its lint table (instead of `[lints] workspace = true`) so audited
# operating-system FFI boundaries can opt in with a per-item
# `#[allow(unsafe_code)]`. Every workspace lint is mirrored verbatim; only
# `unsafe_code` is downgraded from `forbid` to `deny`, so unsafe stays denied
# crate-wide and every use must carry an explicit, greppable allow.
[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
