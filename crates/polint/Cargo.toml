[package]
name = "polint"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Multi-language repo-local static-analysis rules (Go and TypeScript/JavaScript today)"

[features]
default = []
# Exposes `polint::_bench::*` for the internal `polint-bench` crate only.
bench = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
globset.workspace = true
ignore.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_resolver.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
petgraph.workspace = true
polint-macros = { path = "../polint-macros", version = "0.1.7" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter.workspace = true
tree-sitter-go.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "polint"
path = "src/main.rs"

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
