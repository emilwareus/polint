[build]
# Incremental artifacts are local to each worktree and can dwarf the actual
# build outputs. A shared sccache provides cross-worktree reuse without them.
incremental = false

[env]
# These are inert unless sccache is configured as the Rust compiler wrapper.
SCCACHE_CACHE_SIZE = { value = "10G", force = false }
SCCACHE_IGNORE_SERVER_IO_ERROR = { value = "1", force = false }

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
