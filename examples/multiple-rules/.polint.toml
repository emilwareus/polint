[workspace]
include = ["*.go", "*.tsx"]
exclude = []

[profiles.fast]
rules = [
    "local/no-raw-colors",
    "local/go-import-boundaries",
]

[[rules.config]]
id = "local/no-raw-colors"
severity = "error"
files = ["*.tsx"]

[[rules.config]]
id = "local/go-import-boundaries"
severity = "error"
files = ["*.go"]

[rules.config.forbidden_imports]
"*.go" = ["net/http"]
